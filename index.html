<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEEP SEA LAB</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash">
    <div id="splash-content">
      <img src="public/assets/logo/deep-sea-lab-logo.png" alt="DEEP SEA LAB" id="splash-logo" />
      <div id="splash-tap">TAP</div>
    </div>
    <canvas id="noise-canvas"></canvas>
  </div>

  <div id="app">
    <!-- Header -->
    <header id="header">
      <img src="public/assets/logo/deep-sea-lab-logo.png" alt="DEEP SEA LAB" id="logo" />
    </header>

    <!-- Room viewport -->
    <div id="room-viewport">
      <img id="room-bg" src="public/assets/maps/living-room.png" alt="Living Room" />

      <!-- Characters -->
      <div class="character" id="char-a" data-char="a">
        <img src="public/assets/characters/researcher-a-front.png" alt="研究員A" />
      </div>
      <div class="character" id="char-b" data-char="b">
        <img src="public/assets/characters/researcher-b-front.png" alt="研究員B" />
      </div>
      <div class="character" id="char-c" data-char="c">
        <img src="public/assets/characters/researcher-c-front.png" alt="研究員C" />
      </div>

      <!-- Speech bubble -->
      <div id="speech-bubble" class="hidden">
        <p id="speech-text"></p>
      </div>
    </div>

    <!-- Room navigation -->
    <nav id="room-nav">
      <button class="room-btn active" data-room="living-room">居間</button>
      <button class="room-btn" data-room="control-room">司令室</button>
    </nav>

    <!-- Media Player -->
    <section id="media-section">
      <div id="media-input-bar">
        <div id="media-type-tabs">
          <button class="media-tab active" data-type="url">URL</button>
          <button class="media-tab" data-type="video">動画</button>
          <button class="media-tab" data-type="photo">写真</button>
          <button class="media-tab" data-type="file">ファイル</button>
        </div>
        <div id="media-input-area">
          <!-- URL input (default) -->
          <div id="input-url" class="media-input-content">
            <input type="text" id="url-input" placeholder="YouTube / SUNO AI のURLを貼り付け" />
            <button id="url-submit">再生</button>
          </div>
          <!-- Video file input -->
          <div id="input-video" class="media-input-content hidden">
            <label class="file-label">
              <span>動画ファイルを選択</span>
              <input type="file" id="video-file-input" accept="video/*" />
            </label>
          </div>
          <!-- Photo input -->
          <div id="input-photo" class="media-input-content hidden">
            <label class="file-label">
              <span>写真を選択</span>
              <input type="file" id="photo-file-input" accept="image/*" />
            </label>
          </div>
          <!-- Generic file input -->
          <div id="input-file" class="media-input-content hidden">
            <label class="file-label">
              <span>ファイルを選択</span>
              <input type="file" id="generic-file-input" accept="audio/*,video/*,image/*" />
            </label>
          </div>
        </div>
      </div>
      <!-- Player display area -->
      <div id="media-player" class="hidden">
        <button id="media-close" title="閉じる">&times;</button>
        <div id="player-container"></div>
      </div>
    </section>
  </div>

  <!-- Theme Song (BGM) -->
  <audio id="theme-song" loop preload="auto">
    <source src="public/assets/audio/deep-sea-lab.mp3" type="audio/mpeg" />
  </audio>

  <script src="src/main.js"></script>
</body>
</html>
